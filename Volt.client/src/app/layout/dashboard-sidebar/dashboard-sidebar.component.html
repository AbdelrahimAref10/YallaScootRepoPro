<aside
  class="dashboard-sidebar"
  [class.dashboard-sidebar--collapsed]="!isOpen"
  [class.dashboard-sidebar--mobile-open]="isMobileOpen"
  [attr.aria-hidden]="false"
>
  <div class="dashboard-sidebar__brand">
    <div class="dashboard-sidebar__logo-mark" aria-hidden="true">
      <img src="assets/images/Logo.png" alt="" class="dashboard-sidebar__logo-img" />
    </div>
    <div class="dashboard-sidebar__brand-text" *ngIf="isOpen">
      <span class="dashboard-sidebar__brand-name">{{ 'app.name' | t }}</span>
      <span class="dashboard-sidebar__brand-tag">{{ 'app.tagline' | t }}</span>
    </div>

    <button
      type="button"
      class="dashboard-sidebar__close"
      (click)="onCloseMobile()"
      [attr.aria-label]="'header.closeSidebar' | t"
      [title]="'header.closeSidebar' | t"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <nav class="dashboard-sidebar__nav" [attr.aria-label]="'app.name' | t">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="dashboard-sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: item.route === exactActiveRoute }"
      class="dashboard-sidebar__item"
      [attr.title]="item.labelKey | t"
      (click)="onNavClick()"
    >
      <svg class="dashboard-sidebar__item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <ng-container [ngSwitch]="item.icon">
          <path *ngSwitchCase="'dashboard'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          <path *ngSwitchCase="'categories'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
          <path *ngSwitchCase="'subcategories'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/>
          <path *ngSwitchCase="'vehicles'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 17a2 2 0 11-4 0 2 2 0 014 0zm12 0a2 2 0 11-4 0 2 2 0 014 0zM5 17H3v-5l2-5h9l3 5h2v5h-2M8 17h8"/>
          <path *ngSwitchCase="'users'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m6-5a3 3 0 11-6 0 3 3 0 016 0zm6 2a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
          <path *ngSwitchCase="'system-users'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          <path *ngSwitchCase="'roles'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          <ng-container *ngSwitchCase="'cities'">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </ng-container>
          <path *ngSwitchCase="'orders'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          <path *ngSwitchCase="'reports'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          <path *ngSwitchCase="'support'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
        </ng-container>
      </svg>
      <span class="dashboard-sidebar__item-label" *ngIf="isOpen">{{ item.labelKey | t }}</span>
    </a>
  </nav>

  <div class="dashboard-sidebar__footer" *ngIf="isOpen">
    <span class="dashboard-sidebar__footer-text">{{ footerKey | t }}</span>
  </div>
</aside>
