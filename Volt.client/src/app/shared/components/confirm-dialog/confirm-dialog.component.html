<div *ngIf="isVisible" class="confirm-dialog__overlay">
  <div class="confirm-dialog__container">
    <div class="confirm-dialog__header">
      <div class="confirm-dialog__icon-wrapper" [class]="'confirm-dialog__icon-wrapper--' + type">
        <svg *ngIf="type === 'danger'" class="confirm-dialog__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <svg *ngIf="type === 'warning'" class="confirm-dialog__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <svg *ngIf="type === 'info'" class="confirm-dialog__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="confirm-dialog__title">{{ title }}</h2>
    </div>
    <div class="confirm-dialog__body">
      <p class="confirm-dialog__message">{{ message }}</p>
    </div>
    <div class="confirm-dialog__footer">
      <button
        type="button"
        (click)="onCancel()"
        class="confirm-dialog__btn confirm-dialog__btn--cancel"
        [disabled]="isLoading"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="confirm-dialog__btn confirm-dialog__btn--confirm"
        [class]="'confirm-dialog__btn--' + type"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="confirm-dialog__spinner"></span>
        <span>{{ confirmText }}</span>
      </button>
    </div>
  </div>
</div>
