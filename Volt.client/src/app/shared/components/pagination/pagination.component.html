<nav
  class="pagination"
  *ngIf="totalCount > 0"
  [attr.aria-label]="'common.page' | t"
>
  <div class="pagination__group">
    <button
      type="button"
      class="pagination__nav"
      (click)="goPrev()"
      [disabled]="!canGoPrev"
      [attr.title]="'common.previous' | t"
      [attr.aria-label]="'common.previous' | t"
    >
      <svg class="pagination__nav-icon pagination__nav-icon--prev" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>

    <div class="pagination__pages" role="list">
      <ng-container *ngFor="let item of pages">
        <span *ngIf="!isNumber(item)" class="pagination__ellipsis" aria-hidden="true">…</span>
        <button
          *ngIf="isNumber(item)"
          type="button"
          role="listitem"
          class="pagination__page"
          [class.pagination__page--active]="item === currentPage"
          [attr.aria-current]="item === currentPage ? 'page' : null"
          [attr.aria-label]="'common.goToPage' | t:{ page: item }"
          (click)="goTo(item)"
        >
          {{ item }}
        </button>
      </ng-container>
    </div>

    <button
      type="button"
      class="pagination__nav"
      (click)="goNext()"
      [disabled]="!canGoNext"
      [attr.title]="'common.next' | t"
      [attr.aria-label]="'common.next' | t"
    >
      <svg class="pagination__nav-icon pagination__nav-icon--next" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</nav>
