<section id="start" class="relative overflow-hidden bg-[#3a1216]">
  <div class="absolute inset-0">
    <app-photo file="cta.jpg" [alt]="'CTA.ALT' | translate">
      <div class="h-full w-full bg-gradient-to-r from-[#7a1820] to-[#1a0c10]"></div>
    </app-photo>
  </div>
  <div class="absolute inset-0 bg-gradient-to-r from-black/55 via-black/35 to-black/20"></div>
  <div class="container-fluid relative py-24 lg:py-28">
    <p class="eyebrow !text-white">{{ 'CTA.KICKER' | translate }}</p>
    <h2 class="mt-3 max-w-xl font-landing-display text-4xl font-extrabold leading-tight tracking-tight text-white sm:text-5xl">{{ 'CTA.TITLE' | translate }}</h2>
    <p class="mt-4 max-w-md text-white/85">{{ 'CTA.SUB' | translate }}</p>
    <a class="lp-btn lp-btn-red mt-8" href="#contact">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
      {{ 'CTA.BTN' | translate }}
    </a>
  </div>
</section>
