<section id="why" class="bg-white py-20 lg:py-24">
  <div class="container-fluid grid items-center gap-12 lg:grid-cols-2">
    <div class="relative aspect-[5/4] overflow-hidden rounded-3xl bg-mist" appReveal>
      <app-photo file="why.jpg" [alt]="'WHY.ALT' | translate">
        <div class="h-full w-full bg-gradient-to-br from-[#d7dde6] to-[#f7f4ef]"></div>
      </app-photo>
    </div>
    <div appReveal>
      <p class="eyebrow">{{ 'WHY.KICKER' | translate }}</p>
      <h2 class="mt-3 font-landing-display text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl">{{ 'WHY.TITLE' | translate }}</h2>
      <ul class="mt-8 space-y-6">
        <li *ngFor="let item of items">
          <h3 class="flex items-center gap-2 font-landing-display text-xl font-extrabold">
            <svg class="h-5 w-5 text-yalla-red" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            {{ item.title | translate }}
          </h3>
          <p class="mt-1 pl-7 text-sm leading-relaxed text-inksoft">{{ item.body | translate }}</p>
        </li>
      </ul>
    </div>
  </div>
</section>
