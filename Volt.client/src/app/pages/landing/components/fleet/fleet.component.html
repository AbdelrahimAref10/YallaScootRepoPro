<section id="fleet" class="relative overflow-hidden bg-night py-20 text-white lg:py-24">
  <div class="pointer-events-none absolute -left-16 top-0 h-64 w-64 rounded-full bg-yalla-red/20"></div>
  <div class="pointer-events-none absolute right-0 top-8 h-40 w-72 bg-yalla-red/15" style="clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 80%)"></div>

  <div class="container-fluid relative">
    <div appReveal>
      <p class="eyebrow !text-yalla-yellow">{{ 'FLEET.KICKER' | translate }}</p>
      <h2 class="mt-3 max-w-xl font-landing-display text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl">{{ 'FLEET.TITLE' | translate }}</h2>
      <p class="mt-4 max-w-2xl text-base leading-relaxed text-white/75">{{ 'FLEET.NOTE' | translate }}</p>
    </div>

    <div class="mt-10 grid gap-5 md:grid-cols-3">
      <article *ngFor="let type of types" class="flex h-full flex-col overflow-hidden rounded-2xl bg-white text-ink shadow-card" appReveal>
        <div class="flex h-64 items-center justify-center bg-white sm:h-72">
          <img class="max-h-full max-w-full object-contain" [src]="'assets/images/' + type.file" [alt]="type.name | translate" />
        </div>
        <h3 class="px-5 py-4 font-landing-display text-xl font-extrabold">{{ type.name | translate }}</h3>
      </article>
    </div>
  </div>
</section>
