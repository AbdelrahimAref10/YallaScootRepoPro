<section id="riders" class="bg-mist py-20 lg:py-24" (mouseenter)="pause()" (mouseleave)="resume()">
  <div class="container-fluid">
    <div class="flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between" appReveal>
      <div>
        <p class="eyebrow">{{ 'TESTIMONIALS.KICKER' | translate }}</p>
        <h2 class="mt-3 font-landing-display text-4xl font-extrabold tracking-tight text-ink sm:text-5xl">{{ 'TESTIMONIALS.TITLE' | translate }}</h2>
      </div>
      <div class="flex gap-2">
        <button type="button" class="grid h-11 w-11 place-items-center rounded-full bg-white text-ink shadow-card transition hover:bg-yalla-red hover:text-white" (click)="step(-1)" [attr.aria-label]="'TESTIMONIALS.PREV' | translate">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="grid h-11 w-11 place-items-center rounded-full bg-white text-ink shadow-card transition hover:bg-yalla-red hover:text-white" (click)="step(1)" [attr.aria-label]="'TESTIMONIALS.NEXT' | translate">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="mt-10 overflow-hidden" appReveal>
      <div
        class="flex"
        [style.transform]="'translateX(-' + shift + '%)'"
        [style.transition]="animating ? 'transform 700ms ease' : 'none'">
        <div *ngFor="let note of slides" class="shrink-0 px-2.5" [style.width.%]="100 / perView">
          <figure class="flex h-full min-h-[280px] flex-col rounded-2xl bg-white p-6 shadow-card">
            <div class="flex gap-1 text-yalla-yellow">
              <svg *ngFor="let star of stars" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 1.6l2.2 4.8 5.2.6-3.9 3.5 1.1 5.3L10 13.4 5.4 15.8l1.1-5.3L2.6 7l5.2-.6L10 1.6z"/>
              </svg>
            </div>
            <blockquote class="mt-4 flex-1 text-base leading-relaxed text-ink">{{ note.quote | translate }}</blockquote>
            <figcaption class="mt-6 flex items-center gap-3 border-t border-black/5 pt-5">
              <span class="relative h-12 w-12 shrink-0 overflow-hidden rounded-full bg-mist">
                <app-photo [file]="note.file" [alt]="note.name | translate">
                  <span class="grid h-full w-full place-items-center bg-yalla-red font-extrabold text-white">{{ (note.name | translate).slice(0, 1) }}</span>
                </app-photo>
              </span>
              <span>
                <span class="block font-extrabold text-ink">{{ note.name | translate }}</span>
                <span class="block text-xs font-extrabold uppercase tracking-wider text-yalla-red">{{ 'TESTIMONIALS.ROLE' | translate }}</span>
              </span>
              <svg class="ml-auto h-8 w-8 text-yalla-red/80" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 7H6.5C5 7 4 8.2 4 10.2V17h6v-6H7.2c.2-1.4.9-2 2.8-2V7zm10 0h-3.5C15 7 14 8.2 14 10.2V17h6v-6h-2.8c.2-1.4.9-2 2.8-2V7z"/></svg>
            </figcaption>
          </figure>
        </div>
      </div>
    </div>

    <div class="mt-8 flex justify-center gap-2">
      <button
        *ngFor="let note of notes; let i = index"
        type="button"
        class="h-2.5 rounded-full transition-all"
        [ngClass]="(index % notes.length) === i ? 'w-8 bg-yalla-red' : 'w-2.5 bg-black/15'"
        (click)="go(i)"
        [attr.aria-label]="(note.name | translate)">
      </button>
    </div>
  </div>
</section>
